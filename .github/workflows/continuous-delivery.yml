name: Entrega Continua (CD)

on:
  push:
    branches:
      - "**"

jobs:
  # Equivalente ao "build-job" solicitado na Ação 2.
  build-job:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Exibir usuário que iniciou a execução
        run: echo "Olá, ${{ github.actor }}!"

  # Equivalente ao "test-job2" solicitado na Ação 1.
  test-job2:
    name: Teste complementar
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Executar teste complementar
        run: echo "Testes complementares executados com sucesso."

  # Equivalente ao "deploy-prod-job" solicitado na Ação 3.
  deploy-production:
    name: Deploy em produção
    needs: test-job2
    runs-on: ubuntu-latest
    # A aprovação manual é configurada nos Required reviewers do Environment.
    environment:
      name: production
    steps:
      - name: Exibir branch a implantar
        run: echo "Implantando a branch ${{ github.ref_name }} em produção..."
      - name: Simular implantação
        run: sleep 20
      - name: Confirmar sucesso
        run: echo "Implantação concluída com sucesso!"
