name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-job:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Exibir usuário
        run: echo "Olá, ${{ github.actor }}!"

  test-job:
    name: Test job
    needs: build-job
    runs-on: ubuntu-latest

    steps:
      - name: Executar teste
        run: echo "This job tests something"